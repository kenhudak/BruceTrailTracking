<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruce Trail Progress</title>
  <meta name="description" content="Tracking our end-to-end hike of the Bruce Trail, one hike at a time." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- leaflet-gpx (GPX parsing + rendering) -->
  
  <script src="https://unpkg.com/leaflet-gpx@1.7.0/gpx.js"></script>

  <!-- Leaflet.PolylineMeasure (measurement tool) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.polylinemeasure@3.0.0/Leaflet.PolylineMeasure.css" />
  <script src="https://unpkg.com/leaflet.polylinemeasure@3.0.0/Leaflet.PolylineMeasure.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="bento">

    <!-- Title card -->
    <section class="card card--title" aria-label="Site title">
      <div class="blaze" aria-hidden="true"></div>
      <h1>Bruce Trail<br />Progress</h1>
      <p class="tagline">Queenston to Tobermory, one hike at a time.</p>
    </section>

    <!-- Map card: the centerpiece -->
    <section class="card card--map" aria-label="Trail map">
      <div id="map"></div>
    </section>

    <!-- Stats card -->
    <section class="card card--stats" aria-label="Hiking statistics">
      <h2 class="card-label">Progress</h2>
      <div class="stat-row">
        <div class="stat">
          <span class="stat-value" id="stat-km">–</span>
          <span class="stat-unit">km hiked</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-pct">–</span>
          <span class="stat-unit">of the trail</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-hikes">–</span>
          <span class="stat-unit">hikes</span>
        </div>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Trail completion" aria-valuemin="0" aria-valuemax="100" id="progress-bar-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <!-- Base layer switcher card -->
    <section class="card card--layers" aria-label="Map style">
      <h2 class="card-label">Map style</h2>
      <div class="layer-buttons" role="group" aria-label="Choose base map">
        <button class="layer-btn is-active" data-layer="normal">Normal</button>
        <button class="layer-btn" data-layer="dark">Dark</button>
        <button class="layer-btn" data-layer="topo">Topo</button>
      </div>
      <button class="locate-btn" id="locate-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
        Find me on the trail
      </button>
      <p class="locate-status" id="locate-status"></p>
    </section>

    <!-- Hike log card -->
    <section class="card card--hikes" aria-label="Completed hikes">
      <h2 class="card-label">Hike log</h2>
      <ul class="hike-list" id="hike-list">
        <li class="hike-empty">Loading tracks…</li>
      </ul>
    </section>

    <!-- Footer strip -->
    <footer class="card card--footer">
      <span>White blazes mark the way · Niagara Escarpment, Ontario</span>
      <span id="footer-updated"></span>
    </footer>

  </main>

  <script src="js/tracks.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
